<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Gallery</title>
  <meta name="description" content="A gallery of parametric design studies — black & gold.">
  <!-- Self-hosted fonts (Oswald + Manrope) — no external dependency, works
       everywhere including networks that block Google Fonts. -->
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d4af6a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23d4af6a'/%3E%3C/svg%3E">
  <script src="assets/site.js"></script>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" id="wordmark" href="index.html"></a>
    <nav class="nav">
      <a class="nav-link" data-nav="index" href="index.html">Works</a>
      <a class="nav-link" data-nav="about" href="about.html">About</a>
    </nav>
    <a id="external-link" class="top-link" target="_blank" rel="noopener" hidden></a>
  </header>

  <main>
    <section class="hero">
      <p class="hero-kicker">Parametric Gallery</p>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-rule" aria-hidden="true"></div>
    </section>

    <section class="grid" id="grid"></section>

    <p class="empty" id="empty" hidden>
      还没有作品 —— 把图片放进 <code>images/</code> 文件夹并推送即可。<br>
      命名如 <code>Snowflakes (1).jpg</code>，同名多张自动成组。
    </p>
  </main>

  <footer class="footer">
    <span id="footer-author"></span>
    <span class="footer-sep" id="footer-count" hidden></span>
  </footer>

  <!-- ── Post lightbox ── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品预览" hidden>
    <div class="lb-backdrop" data-close></div>

    <header class="lb-head">
      <div class="lb-meta">
        <h2 class="lb-title" id="lb-title"></h2>
        <p class="lb-sub"><span id="lb-counter"></span></p>
      </div>
      <button class="lb-btn lb-close" data-close aria-label="关闭 (Esc)">✕</button>
    </header>

    <button class="lb-btn lb-arrow lb-prev" id="lb-prev" aria-label="上一张 (←)">←</button>
    <figure class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="" draggable="false">
    </figure>
    <button class="lb-btn lb-arrow lb-next" id="lb-next" aria-label="下一张 (→)">→</button>

    <nav class="lb-thumbs" id="lb-thumbs" aria-label="本组图片"></nav>
  </div>

  <script src="assets/gallery-core.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/chrome.js"></script>
</body>
</html>
