<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Gallery</title>
  <meta name="description" content="A gallery of parametric design studies — black & gold.">
  <!-- Self-hosted Oswald — no external dependency, works everywhere. -->
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d4af6a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23d4af6a'/%3E%3C/svg%3E">
  <script src="assets/site.js"></script>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" id="wordmark" href="#top"></a>
    <nav class="nav">
      <a class="nav-link" href="#about">About</a>
      <a class="nav-link" href="#works">Works</a>
    </nav>
    <a id="external-link" class="top-link" target="_blank" rel="noopener" hidden></a>
  </header>

  <main id="top">
    <!-- ── About hero: 16:9 portrait, title left, bio centered ── -->
    <section class="about-hero" id="about-hero">
      <img class="about-hero-img" id="about-hero-img" alt="">
      <div class="about-hero-overlay" aria-hidden="true"></div>
      <div class="about-hero-content">
        <div class="about-hero-inner">
          <h1 class="about-heading" id="about-heading"></h1>
          <div class="about-bio" id="about-bio"></div>
          <div class="about-contact" id="about-contact"></div>
        </div>
      </div>
    </section>

    <!-- ── Works ── -->
    <section class="works" id="works">
      <p class="section-label" id="works-label"></p>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>
        No works yet — drop images into the <code>images/</code> folder and push.<br>
        Name them like <code>Snowflakes (1).jpg</code>; same-name files group into one post.
      </p>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-author"></span>
    <span class="footer-sep" id="footer-count" hidden></span>
  </footer>

  <!-- ── Post lightbox ── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Work preview" hidden>
    <div class="lb-backdrop" data-close></div>

    <header class="lb-head">
      <div class="lb-meta">
        <h2 class="lb-title" id="lb-title"></h2>
        <p class="lb-sub"><span id="lb-counter"></span></p>
      </div>
      <button class="lb-btn lb-close" data-close aria-label="Close (Esc)">✕</button>
    </header>

    <button class="lb-btn lb-arrow lb-prev" id="lb-prev" aria-label="Previous (←)">←</button>
    <figure class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="" draggable="false">
    </figure>
    <button class="lb-btn lb-arrow lb-next" id="lb-next" aria-label="Next (→)">→</button>

    <nav class="lb-thumbs" id="lb-thumbs" aria-label="Images in this post"></nav>
  </div>

  <script src="assets/gallery-core.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/chrome.js"></script>
</body>
</html>
