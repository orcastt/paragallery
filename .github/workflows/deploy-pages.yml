name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Create production-sized images
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 |
          while IFS= read -r -d '' file; do
            temp="${file%.*}.optimized.${file##*.}"
            magick "$file" -auto-orient -resize '1600x1600>' -strip -quality 80 "$temp"
            mv "$temp" "$file"
          done

      - name: Generate gallery manifest
        run: node scripts/build-manifest.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
